services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio:local
    container_name: portfolio-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - portfolio-net

  db:
    image: postgres:17-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio-net
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate:4
    container_name: portfolio-migrate
    restart: "no"
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio-net

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: portfolio-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins-net

networks:
  portfolio-net:
    driver: bridge
  jenkins-net:
    driver: bridge

volumes:
  postgres_data:
  jenkins_home:
