global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "job", "severity"]
  group_wait: 0s
  group_interval: 1s
  repeat_interval: 4h

receivers:
  # This default receiver intentionally has no email/webhook integration yet.
  # Add an email_configs or webhook_configs entry here to deliver notifications.
  - name: default
    telegram_configs:
      - send_resolved: true
        bot_token: 8993198108:AAFeMDX8YgFccDXjF45M6tg_BN2BaZOsAjk
        chat_id: -1004445722502
        message: |
          {{- if eq .Status "resolved" }}
          {{- range .Alerts.Resolved }}
          <b>✅ Resolved: {{ .Annotations.summary }}</b>
          🖥️ <b>Host:</b> {{ .Labels.instance }}
          📝 <b>Detail:</b> {{ .Annotations.description }}
          ⏰ <b>Time:</b> {{ .EndsAt.Format "15:04:05 on 2006.01.02" }}
          {{- end }}
          {{- else }}
          {{- range .Alerts.Firing }}
          <b>🚨 Problem: {{ .Annotations.summary }}</b>
          🖥️ <b>Host:</b> {{ .Labels.instance }}
          ⚡ <b>Severity:</b> {{ .Labels.severity }}
          📝 <b>Detail:</b> {{ .Annotations.description }}
          ⏰ <b>Time:</b> {{ .StartsAt.Format "15:04:05 on 2006.01.02" }}
          {{- end }}
          {{- end }}

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "instance"]
