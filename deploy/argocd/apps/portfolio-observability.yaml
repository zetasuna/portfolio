apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: portfolio
spec:
  project: default
  source:
    repoURL: https://github.com/zetasuna/portfolio.git
    targetRevision: deploy
    path: deploy/k8s/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Grafana/Prometheus/Loki/Tempo keep state in PVCs; never let a sync
      # delete a volume that is temporarily unbound.
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
