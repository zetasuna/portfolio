apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: portfolio
spec:
  project: default
  source:
    repoURL: https://github.com/zetasuna/portfolio.git
    # Jenkins merges main into this branch and commits the image tag bump.
    # Argo must NOT watch main, otherwise the bump would trigger CI again.
    targetRevision: deploy
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
