apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio
resources:
  - postgres/configmap-initdb.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml
  - app/configmap.yaml
  - app/pvc.yaml
  - app/deployment.yaml
  - app/service.yaml
  - app/ingress.yaml
# CI updates only this tag (scripts/ci-gitops-bump.sh). Argo CD renders the
# deployment/migrate containers from it, so there is a single image to pin.
images:
  - name: nam2107/portfolio
    newTag: dc3aef79b8ac
