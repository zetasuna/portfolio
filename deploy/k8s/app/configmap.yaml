apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-app-config
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/part-of: portfolio
data:
  PORT: "8080"
  SESSION_TTL: "12h"
  # Plain HTTP behind the minikube ingress. Set to "true" once TLS terminates at a trusted proxy.
  COOKIE_SECURE: "false"
  PUBLIC_BASE_URL: "http://portfolio.local"
  # Requests always reach the app through the ingress controller, so forwarded headers are trusted.
  TRUST_PROXY_HEADERS: "true"
  # Host header check strips the port; add any extra hostnames you use (e.g. a real domain here).
  ALLOWED_HOSTS: "portfolio.local,localhost,127.0.0.1"
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_BYTES: "5242880"
  TEMPLATE_DIR: "/app/web/templates"
  STATIC_DIR: "/app/web/static"
  MIGRATIONS_DIR: "/app/migrations"
  OTEL_SERVICE_NAME: "portfolio-app"
  # No collector is deployed yet; the OTLP gRPC client dials lazily, so this is harmless.
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
